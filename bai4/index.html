<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2{
            color: pink;
            background-color: black
        }  
        h3{
            color: red;
            background-color: yellow
        }
    </style> 
    
</head>
<body>
    <!-- cách 1: Inline style-->
    <!-- color Quy định màu chữ-->
    <!-- background Quy định màu nền-->
    <h1 style="color: blue; background-color: orange;">Bài STYLE</h1>
    <!-- cách 2: Internal style -->
    <h2> cách 2: Internal style </h2>
    <h3 style="color: red; background-color: rgb(39, 33, 65);"> ví dụ 2 internal style </h3>
    <!-- cách 3: External style -->
    <h4> cách 3: External style </h4>
    <!--  Nếu là id sử dụng # + tên id  -->
    <!-- ví dụ: #tieude1-->
    <h5 id="tieude1"> web 5 </h5>
    <h6 class="tieude2"> web 6 </h6>
</body>
</html>
