<html>
    <head>
        <title>bài 3 web</title>
    </head>
    <body>
        <!-- ol danh sách có thứ tự -->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>
        <!-- ul danh sách không có thứ tự -->
         <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>
        <h1> Form đăng ký </h1>
        <!-- form để tạo biểu mẫu  -->
        <form>
            <div>
                 <!-- nếu input k có type thi mặc định là text -->
                <!-- placeholder là gợi ý cho người dùng -->   
                <!-- readonly là sử dụng để chỉ cho phép đọc, không cho phép chỉnh sửa -->
                <b>Họ và tên</b> <br>
                <input type="text" placeholder="Họ và tên"> <br>
            </div>
            <div>
                <b>Năm sinh</b> <br>
                <input type="number" placeholder="Năm sinh"> <br>
            </div>
            <div>
                <b>Mật khẩu</b> <br>
                <input type="password" placeholder="Mật khẩu"> <br>
            </div>
            <div>
                <b>Giới thiệu về bản thân</b> <br>
                <textarea>Nhập thông tin... </textarea>  <br>
            </div>
           
            <div>
                <b>Email</b> <br>
                <input type="email" placeholder="Email"> <br>
            </div>
            <div>
                <!-- số đầu tiên :0
                số thứ hai : 3,8,9
                8 số còn lại : 0-9 -->
                <b>số điện thoại</b> <br>
                <input type="tel" placeholder="Số điện thoại" 
                pattern="([0]{1})([3,8,9)]{1}[0-9]{8}"> <br>
            </div>
            <div>
                <b>Giới tính</b> <br>
                <input type="radio"  name="gioitinh" value="male"> Nam <br>
                <input type="radio"  name="gioitinh" value="female"> Nữ <br>
            </div>
            <div>
                <b>Sở thích</b> <br>
                <input type="checkbox"  name="sothich" value="chơi game"> Chơi game <br>
                <input type="checkbox"  name="sothich" value="nghe nhạc"> Nghe nhạc <br>
                <input type="checkbox"  name="sothich" value="xem phim"> Xem phim <br>
            </div>
            <div>
                <b>Trình duyệt web ưa thích</b> <br>
                <select name="browser">
                    <option value="Chrome">Chrome</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Edge">Edge</option>
                    <option value="Safari">Safari</option>
                    <option value="Cốc Cốc">Cốc Cốc</option>
                    <option value="Internet Explorer">Internet Explorer</option>
                </select>
            </div>
            <!-- 0 <input type="range" id="a" value="50">100-->
            <div>
                <b>Đánh giá trình duyệt (1-100)</b> <br>
                <input type="range" id="a" value="50" min="1" max="100">
            </div>
            <div>
                <input type="submit">
                <button type="button">Xác nhận</button>
                <input type="reset">
            </div>

        </form>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/NM1cikzWYUQ?si=ubXcomIYp-PdfvyF" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <MAQUEE >
            <img src chelsea.jpg width="100" height="100">
        </MAQUEE>
        <video width="560" height="315" controls>
            <source src="/chamdoi.mp4" type="video/mp4">
        </video>
        <audio controls>
            <source src="/kesaytinh2.mp3" type="audio/mpeg">
    </body>
</html>
